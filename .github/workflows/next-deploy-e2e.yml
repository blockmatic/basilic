name: Next (deploy + E2E)

on:
  pull_request:
    paths:
      - 'apps/next/**'
      - 'scripts/**'
      - 'packages/core/**'
      - 'packages/react/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'apps/fastify/openapi/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'

concurrency:
  group: next-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_ENV: test
  CI: true
  PGLITE: true
  DATABASE_URL: postgresql://localhost/test
  JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
  OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' && secrets.OPEN_ROUTER_API_KEY || 'sk-or-v1-dummy-key-for-unit-tests' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: |
          pnpm turbo run build --filter=@repo/next...
          pnpm turbo run test --filter=@repo/next

  deploy:
    needs: [unit]
    runs-on: ubuntu-latest
    outputs:
      fastify_url: ${{ steps.deploy-fastify.outputs.url }}
      next_url: ${{ steps.deploy-next.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Enable Corepack
        run: corepack enable
      - name: Validate Vercel secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_TOKEN must be set in GitHub secrets. Add both at Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy Fastify (for Next E2E)
        id: deploy-fastify
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: basilic-fastify
        run: |
          echo "::group::Vercel deploy context"
          echo "Project: basilic-fastify"
          pnpm exec vercel --version
          echo "VERCEL_ORG_ID: ${VERCEL_ORG_ID:+set}"
          echo "VERCEL_TOKEN: ${VERCEL_TOKEN:+set}"
          echo "::endgroup::"

          pnpm exec vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --cwd apps/fastify

          if pnpm exec vercel build --token=$VERCEL_TOKEN --cwd apps/fastify; then
            DEPLOY_CMD="deploy --prebuilt"
          else
            echo "::notice::vercel build failed, falling back to full deploy"
            DEPLOY_CMD="deploy"
          fi

          set +e
          DEPLOY_OUTPUT=$(pnpm exec vercel $DEPLOY_CMD --token=$VERCEL_TOKEN --cwd apps/fastify 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUTPUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Vercel deploy failed (exit $DEPLOY_EXIT)"
            exit $DEPLOY_EXIT
          fi

          URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+\.vercel\.app' | head -1 || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Deploy Next
        id: deploy-next
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: basilic-next
          VERCEL: '1'
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: ${{ github.head_ref }}
        run: |
          echo "::group::Vercel deploy context"
          echo "Project: basilic-next"
          pnpm exec vercel --version
          echo "VERCEL_ORG_ID: ${VERCEL_ORG_ID:+set}"
          echo "VERCEL_TOKEN: ${VERCEL_TOKEN:+set}"
          echo "::endgroup::"

          pnpm exec vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --cwd apps/next
          pnpm exec vercel build --token=$VERCEL_TOKEN --cwd apps/next

          set +e
          DEPLOY_OUTPUT=$(pnpm exec vercel deploy --prebuilt --token=$VERCEL_TOKEN --cwd apps/next 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUTPUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Vercel deploy failed (exit $DEPLOY_EXIT)"
            exit $DEPLOY_EXIT
          fi

          URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+\.vercel\.app' | head -1 || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [deploy]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm --filter @repo/next exec playwright install chromium --with-deps
      - name: Run E2E tests
        env:
          PLAYWRIGHT_APP_URL: ${{ needs.deploy.outputs.next_url }}
          PLAYWRIGHT_API_URL: ${{ needs.deploy.outputs.fastify_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        run: pnpm --filter @repo/next test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-next
          path: apps/next/playwright-report/
          retention-days: 30
