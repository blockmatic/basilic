name: Web (E2E)

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/src/routes/auth/**'
      - 'apps/api/src/routes/account/**'
      - 'apps/api/src/routes/ai/**'
      - 'apps/api/src/routes/health/**'
      - 'apps/api/src/routes/test/**'
      - 'scripts/**'
      - 'packages/core/**'
      - 'packages/react/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/error/**'
      - 'tools/eslint/**'
      - 'tools/typescript/**'
      - 'apps/api/openapi/**'
      - '.github/workflows/web-e2e.yml'
      - '.github/actions/setup-pnpm/**'
      - '.github/actions/setup-playwright/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  PGLITE: true
  ALLOW_TEST: true
  RATE_LIMIT_MAX: 10000
  WEBAUTHN_RP_NAME: Test App
  DATABASE_URL: postgresql://localhost/test
  JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
  NEXT_PUBLIC_API_URL: http://localhost:3001
  AI_PROVIDER: anthropic
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-web-${{ hashFiles('**/pnpm-lock.yaml', 'apps/web/**', 'packages/ui/**', 'packages/core/**', 'packages/react/**', 'packages/utils/**', 'packages/error/**') }}
          restore-keys: |
            ${{ runner.os }}-next-web-
      - name: Build
        run: pnpm turbo run build --filter=@repo/web...
      - uses: ./.github/actions/setup-playwright
      - name: E2E tests (local)
        env:
          SKIP_BUILD: '1'
        run: pnpm --filter @repo/web test:e2e:local
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: apps/web/playwright-report/
          retention-days: 30
