name: Web (E2E)

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/**'
      - 'packages/core/**'
      - 'packages/react/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'apps/api/openapi/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_ENV: test
  CI: true
  PGLITE: true
  DATABASE_URL: postgresql://localhost/test
  JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
  NEXT_PUBLIC_API_URL: http://localhost:3001
  AI_PROVIDER: anthropic
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo run build --filter=@repo/web...
      - name: Unit tests
        run: pnpm turbo run test --filter=@repo/web
      - name: Install Playwright
        run: pnpm --filter @repo/web exec playwright install chromium --with-deps
      - name: Verify ANTHROPIC_API_KEY for E2E (AI_PROVIDER=anthropic)
        shell: bash
        env:
          AI_PROVIDER: ${{ env.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        run: |
          if [[ "${AI_PROVIDER}" == "anthropic" && -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "::error::AI_PROVIDER is anthropic but ANTHROPIC_API_KEY is empty or unset. Set the ANTHROPIC_API_KEY repository secret; required before E2E tests (local)." >&2
            exit 1
          fi
      - name: E2E tests (local)
        env:
          SKIP_BUILD: '1'
        run: pnpm --filter @repo/web test:e2e:local
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: apps/web/playwright-report/
          retention-days: 30
