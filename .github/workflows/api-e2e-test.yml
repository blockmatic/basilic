# E2E for Fastify API: triggers on Vercel PR preview deployment (repository_dispatch).
# Workflow lives on main; runs only for previews (target == null), not production.
# Filter: projectId or project.name. Replace prj_0 with your Vercel project ID.
name: API E2E tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL (for manual run)'
        required: false

run-name: API E2E (${{ github.event.client_payload.git.ref || 'manual' }})

concurrency:
  group: e2e-api-${{ github.event.client_payload.git.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    # Only run for PR preview deployments (target == null), not production. workflow_dispatch for manual runs.
    if: github.event_name == 'workflow_dispatch' || (github.event.client_payload.target == null && (github.event.client_payload.projectId == 'prj_0' || github.event.client_payload.project.id == 'prj_0' || github.event.client_payload.project.name == 'basilic-fastify'))
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      PGLITE: true
      DATABASE_URL: postgresql://localhost/test
      JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
    steps:
      - name: Checkout (deployment ref)
        uses: vercel/repository-dispatch/actions/checkout@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/fastify exec playwright install chromium --with-deps

      # CI uses Vercel preview URLs from webhook; never test:e2e:local
      - name: Run E2E tests
        env:
          PLAYWRIGHT_API_URL: ${{ github.event.inputs.deployment_url || github.event.client_payload.url || 'http://localhost:3001' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || 'ci-dummy' }}
        run: pnpm --filter @repo/fastify test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fastify
          path: apps/fastify/playwright-report/
          retention-days: 30
