name: Publish create-basilic

on:
  push:
    tags: ['v*']

concurrency:
  group: publish-create-basilic
  cancel-in-progress: false

jobs:
  pack:
    name: Assemble, pack, and test tarball
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-pnpm
      - name: Assemble and build
        run: |
          CREATE_BASILIC_LOCKFILE=1 pnpm --filter create-basilic assemble
          pnpm --filter create-basilic build
      - name: Pack once
        id: pack
        working-directory: tools/create-basilic
        run: |
          tarball=$(npm pack --pack-destination .)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$tarball" | tee "${tarball}.sha256"
      - name: Test tarball outside the workspace
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          work=$(mktemp -d)
          tar -xzf "tools/create-basilic/$TARBALL" -C "$work"
          dest=$(mktemp -d)/from-tarball
          node "$work/package/dist/cli.js" "$dest" --yes
          test -f "$dest/package.json"
          test ! -d "$dest/apps/docu"
          test ! -d "$dest/tools/create-basilic"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: create-basilic-tarball
          path: |
            tools/create-basilic/${{ steps.pack.outputs.tarball }}
            tools/create-basilic/${{ steps.pack.outputs.tarball }}.sha256
          retention-days: 30

  publish:
    name: Publish npm and GitHub asset
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: create-basilic-tarball
          path: dist-tarball
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Mark GitHub Release pending
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TAG" --notes "Pending npm publish"
          else
            gh release edit "$TAG" --prerelease
          fi
      - name: Publish packed tarball
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          tag=latest
          case "$VERSION" in
            *-*) tag=next ;;
          esac
          npm publish "dist-tarball/$TARBALL" --access public --provenance --tag "$tag"
      - name: Attach tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          gh release upload "$TAG" "dist-tarball/$TARBALL" "dist-tarball/${TARBALL}.sha256" --clobber
          case "$VERSION" in
            *-*) gh release edit "$TAG" --prerelease --latest=false ;;
            *) gh release edit "$TAG" --prerelease=false --latest ;;
          esac
          gh release view "$TAG" --json url --jq .url
      - name: Verify npm package
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm view "create-basilic@$VERSION" dist.integrity; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "npm view create-basilic@$VERSION failed"
              exit 1
            fi
            sleep 10
          done
          work=$(mktemp -d)
          npx --yes "create-basilic@$VERSION" "$work/from-npx" --yes
          test -f "$work/from-npx/package.json"
          test ! -d "$work/from-npx/apps/docu"
          test ! -d "$work/from-npx/tools/create-basilic"
