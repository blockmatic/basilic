name: Packages (Unit Tests)

on:
  pull_request:
    paths:
      - "base/**"
      - "example/**"
      - ".github/workflows/packages-test.yml"
      - ".github/actions/setup-pnpm/**"

concurrency:
  group: packages-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  PGLITE: true
  POSTGRES_URL: postgresql://localhost/test
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: base
            build: pnpm turbo run build --filter=@repo/error... --filter=@repo/core --filter=@repo/react --filter=@repo/db
            test: pnpm turbo run test --filter=@repo/core --filter=@repo/react --filter=@repo/error --filter=@repo/db --filter=@repo/agents
          - workspace: example
            build: pnpm turbo run build --filter=@repo/error... --filter=@repo/core --filter=@repo/react --filter=@repo/db --filter=@repo/markets --filter=@repo/onchain
            test: pnpm turbo run test --filter=@repo/core --filter=@repo/react --filter=@repo/error --filter=@repo/db --filter=@repo/markets --filter=@repo/onchain --filter=@repo/agents
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          workspace: ${{ matrix.workspace }}
      - name: Build packages
        working-directory: ${{ matrix.workspace }}
        run: ${{ matrix.build }}
      - name: Unit tests (packages + agents)
        working-directory: ${{ matrix.workspace }}
        run: ${{ matrix.test }}
