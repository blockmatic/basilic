name: DeepSec

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze diff
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      secrets.AI_GATEWAY_API_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore trusted DeepSec workspace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git rev-parse --verify "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:.deepsec/deepsec.config.ts"; then
            git checkout "$BASE_SHA" -- .deepsec
          fi

      - name: List PR files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: git diff --name-only --diff-filter=AMRC "${BASE_SHA}...HEAD" | tee "${{ github.workspace }}/deepsec-files.txt"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Get pnpm store directory
        working-directory: .deepsec
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-deepsec-pnpm-${{ hashFiles('.deepsec/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deepsec-pnpm-

      - name: Install DeepSec
        working-directory: .deepsec
        run: pnpm install --frozen-lockfile

      - name: Configure DeepSec credentials
        working-directory: .deepsec
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          printf 'AI_GATEWAY_API_KEY=%s\nOPENAI_API_KEY=%s\nOPENAI_BASE_URL=https://ai-gateway.vercel.sh/v1\n' \
            "$AI_GATEWAY_API_KEY" "$AI_GATEWAY_API_KEY" > .env.local
          chmod 600 .env.local

      - name: Review PR diff
        id: deepsec
        working-directory: .deepsec
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENAI_BASE_URL: https://ai-gateway.vercel.sh/v1
        run: |
          set -o pipefail
          pnpm exec deepsec process \
            --agent codex \
            --model gpt-5.6-sol \
            --thinking-level medium \
            --root "${{ github.workspace }}" \
            --files-from "${{ github.workspace }}/deepsec-files.txt" \
            --comment-out ../comment.md \
            2>&1 | tee "${{ github.workspace }}/deepsec.log"

      - name: Upload DeepSec log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-log
          path: deepsec.log
          retention-days: 1

      - name: Upload findings comment
        if: always() && hashFiles('comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-comment
          path: comment.md
          retention-days: 1

  comment:
    name: Comment findings
    needs: analyze
    if: always() && needs.analyze.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download findings comment
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deepsec-comment

      - name: Post PR comment
        if: steps.dl.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('comment.md', 'utf8'),
            })
