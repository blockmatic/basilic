name: DeepSec

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze diff
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore trusted DeepSec workspace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git rev-parse --verify "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:.deepsec/deepsec.config.ts"; then
            git checkout "$BASE_SHA" -- .deepsec
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Get pnpm store directory
        working-directory: .deepsec
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-deepsec-pnpm-${{ hashFiles('.deepsec/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deepsec-pnpm-

      - name: Install DeepSec
        working-directory: .deepsec
        run: pnpm install --frozen-lockfile

      - name: Configure DeepSec credentials
        working-directory: .deepsec
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=Missing DeepSec credentials::Add AI_GATEWAY_API_KEY (recommended) or OPENAI_API_KEY to repository secrets (Settings → Secrets and variables → Actions). See https://github.com/vercel-labs/deepsec/blob/main/docs/vercel-setup.md"
            exit 1
          fi
          if [ -n "$AI_GATEWAY_API_KEY" ]; then
            printf 'AI_GATEWAY_API_KEY=%s\nOPENAI_API_KEY=%s\nOPENAI_BASE_URL=https://ai-gateway.vercel.sh/v1\n' \
              "$AI_GATEWAY_API_KEY" "$AI_GATEWAY_API_KEY" > .env.local
          elif [ -n "$OPENAI_API_KEY" ]; then
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" > .env.local
          fi
          chmod 600 .env.local

      - name: Review PR diff
        id: deepsec
        working-directory: .deepsec
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$AI_GATEWAY_API_KEY" ]; then
            export OPENAI_API_KEY="$AI_GATEWAY_API_KEY"
            export OPENAI_BASE_URL="https://ai-gateway.vercel.sh/v1"
            MODEL=gpt-5.6-sol
          else
            MODEL=gpt-5.5
          fi
          pnpm exec deepsec process \
            --agent codex \
            --model "$MODEL" \
            --thinking-level medium \
            --diff "$BASE_SHA" \
            --comment-out ../comment.md

      - name: Upload findings comment
        if: always() && hashFiles('comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-comment
          path: comment.md
          retention-days: 1

  comment:
    name: Comment findings
    needs: analyze
    if: always() && needs.analyze.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download findings comment
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deepsec-comment

      - name: Post PR comment
        if: steps.dl.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('comment.md', 'utf8'),
            })
