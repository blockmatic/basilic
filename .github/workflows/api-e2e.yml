name: API (E2E)

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/email/**'
      - 'packages/error/**'
      - 'packages/utils/**'
      - 'tools/eslint-config/**'
      - 'tools/typescript-config/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'

concurrency:
  group: api-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  PGLITE: true
  DATABASE_URL: postgresql://localhost/test
  JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Check OpenAPI drift
        run: |
          pnpm generate
          git diff --exit-code -- apps/api/openapi/openapi.json packages/core/src/gen packages/core/src/api-wrapper.gen.ts packages/core/src/api-client.gen.ts packages/cli/src/gen
          untracked=$(git status --short --untracked-files=all -- packages/core/src/gen packages/cli/src/gen)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            exit 1
          fi
      - name: Unit tests with coverage
        run: pnpm --filter @repo/api test:cov
      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-vitest-coverage
          path: apps/api/coverage/
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright
        run: pnpm --filter @repo/api exec playwright install chromium --with-deps
      - name: Build API dependencies
        run: pnpm turbo run build --filter=@repo/api...
      - name: E2E tests (local)
        run: pnpm --filter @repo/api test:e2e:local
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: apps/api/playwright-report/
          retention-days: 30
