name: Docu (deploy)

on:
  pull_request:
    paths:
      - 'apps/docu/**'
      - 'packages/ui/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'

concurrency:
  group: docu-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_ENV: test
  CI: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Enable Corepack
        run: corepack enable
      - name: Validate Vercel secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_TOKEN must be set in GitHub secrets. Add both at Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Set Vercel root directory
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS -X PATCH "https://api.vercel.com/v9/projects/basilic-docs?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": null}' || true
      - name: Deploy Docu
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: basilic-docs
        run: |
          echo "::group::Vercel deploy context"
          echo "Project: basilic-docs"
          pnpm exec vercel --version
          echo "VERCEL_ORG_ID: ${VERCEL_ORG_ID:+set}"
          echo "VERCEL_TOKEN: ${VERCEL_TOKEN:+set}"
          echo "::endgroup::"

          pnpm exec vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --cwd apps/docu
          pnpm exec vercel build --token=$VERCEL_TOKEN --cwd apps/docu

          set +e
          DEPLOY_OUTPUT=$(pnpm exec vercel deploy --prebuilt --token=$VERCEL_TOKEN --cwd apps/docu 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUTPUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Vercel deploy failed (exit $DEPLOY_EXIT)"
            exit $DEPLOY_EXIT
          fi
