name: E2E Tests

on:
  pull_request:
    paths:
      - 'apps/next/e2e/**'
      - 'apps/next/**'
      - 'apps/fastify/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'apps/next/e2e/**'
      - 'apps/next/**'
      - 'apps/fastify/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests (Next.js + Fastify)
    runs-on: ubuntu-latest
    env:
      CI: true
      PGLITE: true
      DATABASE_URL: postgresql://localhost/test
      JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PLAYWRIGHT_HTML_REPORT_OPEN: never
    steps:
      - name: Verify OPEN_ROUTER_API_KEY
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          if [ -z "$OPEN_ROUTER_API_KEY" ]; then
            echo "::error::OPEN_ROUTER_API_KEY secret is required for E2E tests. Add it in repository secrets."
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          pnpm --filter @repo/next exec playwright install chromium --with-deps
          pnpm --filter @repo/fastify exec playwright install chromium --with-deps

      - name: Build
        run: pnpm turbo run build

      - name: Run E2E tests (sequential, root script)
        run: pnpm test:e2e

      - name: Upload Next.js Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nextjs
          path: apps/next/playwright-report/
          retention-days: 30

      - name: Upload Fastify Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fastify
          path: apps/fastify/playwright-report/
          retention-days: 30
