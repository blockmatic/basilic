# E2E for Next: triggers on Vercel deployment (repository_dispatch), runs Playwright against deployed URL.
# Filter by project.id - get from Vercel Project Settings → General. Or use project.name == 'basilic-next'.
name: Next E2E tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.ready
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL (for manual run)'
        required: false
      git_ref:
        description: 'Git ref/branch (for API URL derivation)'
        required: false
        default: 'main'

run-name: Next E2E (${{ github.event.client_payload.git.ref || 'manual' }})

concurrency:
  group: e2e-next-${{ github.event.client_payload.git.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    # Filter: project.id (replace prj_0) or project.name == 'basilic-next'
    if: github.event_name == 'workflow_dispatch' || (github.event.client_payload.project != null && (github.event.client_payload.project.id == 'prj_0' || github.event.client_payload.project.name == 'basilic-next'))
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      PGLITE: true
      DATABASE_URL: postgresql://localhost/test
      JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' && secrets.OPEN_ROUTER_API_KEY || 'sk-or-v1-dummy-key-for-unit-tests' }}
    steps:
      - name: Checkout (deployment ref)
        uses: vercel/repository-dispatch/actions/checkout@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/next exec playwright install chromium --with-deps

      - name: Derive API URL and run E2E
        env:
          PLAYWRIGHT_APP_URL: ${{ github.event.inputs.deployment_url || github.event.client_payload.url || 'https://localhost:3000' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || 'ci-dummy' }}
        run: |
          REF="${{ github.event.inputs.git_ref || github.event.client_payload.git.ref || 'main' }}"
          SLUG=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//' | cut -c1-63)
          export PLAYWRIGHT_API_URL="https://basilic-fastify-git-${SLUG}-gaboesquivel.vercel.app"
          pnpm --filter @repo/next test:e2e
        shell: bash

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-next
          path: apps/next/playwright-report/
          retention-days: 30
