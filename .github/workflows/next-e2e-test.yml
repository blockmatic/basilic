# E2E for basilic-next: runs after Vercel repository_dispatch.
# Only Vercel publishes these events. Success → run tests. Error/failed → fail (PR red). Skipped/ignored/canceled → skip.
name: Next e2e test

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'
      - 'vercel.deployment.error'
      - 'vercel.deployment.failed'
      - 'vercel.deployment.skipped'
      - 'vercel.deployment.ignored'
      - 'vercel.deployment.canceled'

run-name: E2E – ${{ github.event.client_payload.project.name || 'unknown' }}

concurrency:
  group: e2e-next-${{ github.event.client_payload.project.name }}-${{ github.event.client_payload.git.sha }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Next (E2E)
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.client_payload.project.name, 'basilic-next')
      && (github.event.action == 'vercel.deployment.success'
          || github.event.action == 'vercel.deployment.error'
          || github.event.action == 'vercel.deployment.failed')
    env:
      NODE_ENV: test
      CI: true
      PGLITE: true
      DATABASE_URL: postgresql://localhost/test
      JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' && secrets.OPEN_ROUTER_API_KEY || 'sk-or-v1-dummy-key-for-unit-tests' }}
    steps:
      - name: Debug repository_dispatch payload
        run: |
          echo "::group::Vercel repository_dispatch payload"
          echo "event.action=${{ github.event.action }}"
          echo "project.name=${{ github.event.client_payload.project.name }}"
          echo "project.id=${{ github.event.client_payload.project.id }}"
          echo "environment=${{ github.event.client_payload.environment }}"
          echo "url=${{ github.event.client_payload.url }}"
          echo "git.sha=${{ github.event.client_payload.git.sha }}"
          echo "git.ref=${{ github.event.client_payload.git.ref }}"
          echo "deployment.id=${{ github.event.client_payload.id }}"
          echo "::endgroup::"

      - name: Abort on deployment failure
        if: >-
          github.event.action == 'vercel.deployment.error'
          || github.event.action == 'vercel.deployment.failed'
        run: |
          echo "::error::Vercel deployment failed (action=${{ github.event.action }}), aborting E2E"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/next exec playwright install chromium --with-deps

      - name: Verify OPEN_ROUTER_API_KEY for E2E
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          if [ -z "$OPEN_ROUTER_API_KEY" ]; then
            echo "::error::OPEN_ROUTER_API_KEY secret is required for E2E tests. Add it in repository secrets."
            exit 1
          fi

      - name: Run E2E tests
        id: e2e
        env:
          PLAYWRIGHT_APP_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || 'ci-dummy' }}
        run: pnpm --filter @repo/next test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nextjs
          path: apps/next/playwright-report/
          retention-days: 30
