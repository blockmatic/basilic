# E2E for Next + Fastify: triggers on pull_request, polls Vercel API for deployments, runs Playwright.
# Matrix strategy runs Next and Fastify E2E in parallel when path filter matches.
name: E2E tests

on:
  pull_request:

run-name: E2E (${{ github.event.pull_request.head.ref || github.ref_name }})

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.filter.outputs.next }}
      api: ${{ steps.filter.outputs.api }}
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/paths-filter.yml

      - name: Set apps matrix
        id: apps
        run: |
          APPS='[]'
          [[ "${{ steps.filter.outputs.next }}" == 'true' ]] && APPS=$(echo "$APPS" | jq -c '. + ["next"]')
          [[ "${{ steps.filter.outputs.api }}" == 'true' ]] && APPS=$(echo "$APPS" | jq -c '. + ["fastify"]')
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  e2e:
    needs: filter
    if: needs.filter.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.filter.outputs.apps) }}
    runs-on: ubuntu-latest
    name: ${{ matrix.app }} (E2E)
    env:
      NODE_ENV: test
      CI: true
      PGLITE: true
      DATABASE_URL: postgresql://localhost/test
      JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' && secrets.OPEN_ROUTER_API_KEY || 'sk-or-v1-dummy-key-for-unit-tests' }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel Next deployment
        id: wait-app
        if: matrix.app == 'next'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG || secrets.VERCEL_TEAM_SLUG }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID }}
          GITHUB_BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          chmod +x .github/scripts/wait-vercel-deployment.sh
          .github/scripts/wait-vercel-deployment.sh basilic-next app

      - name: Wait for Vercel Fastify deployment
        id: wait-api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG || secrets.VERCEL_TEAM_SLUG }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID }}
          GITHUB_BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: .github/scripts/wait-vercel-deployment.sh basilic-fastify ${{ matrix.app == 'next' && 'api' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/${{ matrix.app }} exec playwright install chromium --with-deps

      - name: Verify OPEN_ROUTER_API_KEY for E2E
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          if [ -z "$OPEN_ROUTER_API_KEY" ]; then
            echo "::error::OPEN_ROUTER_API_KEY secret is required for E2E tests. Add it in repository secrets."
            exit 1
          fi

      - name: Run E2E tests
        id: e2e
        env:
          PLAYWRIGHT_APP_URL: ${{ matrix.app == 'next' && steps.wait-app.outputs.deployment_url_app || '' }}
          PLAYWRIGHT_API_URL: ${{ matrix.app == 'next' && steps.wait-api.outputs.deployment_url_api || steps.wait-api.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || 'ci-dummy' }}
        run: pnpm --filter @repo/${{ matrix.app }} test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 30
