# E2E for Next: triggers on Vercel PR preview deployment (repository_dispatch).
# Workflow lives on main; runs only for previews (target == null), not production.
# Filter: project.name == 'basilic-next'.
name: Next E2E tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL'
        required: true
      git_ref:
        description: 'Git ref/branch (for API URL derivation)'
        required: false
        default: 'main'
      vercel_team_slug:
        description: 'Vercel team/user slug (for API URL, overrides repo var)'
        required: false

run-name: Next E2E (${{ github.event.client_payload.git.ref || 'manual' }})

concurrency:
  group: e2e-next-${{ github.event.client_payload.git.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    # Only run for PR preview deployments (target == null), not production. Skip main/develop. workflow_dispatch for manual runs.
    if: github.event_name == 'workflow_dispatch' || (github.event.client_payload.target == null && github.event.client_payload.project.name == 'basilic-next' && github.event.client_payload.git.ref != 'refs/heads/main' && github.event.client_payload.git.ref != 'refs/heads/develop')
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      PGLITE: true
      DATABASE_URL: postgresql://localhost/test
      JWT_SECRET: e2e-jwt-secret-min-32-chars-for-tests
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' && secrets.OPEN_ROUTER_API_KEY || 'sk-or-v1-dummy-key-for-unit-tests' }}
    steps:
      - name: Checkout (deployment ref)
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/checkout@v1

      - name: Checkout (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/next exec playwright install chromium --with-deps

      # CI uses Vercel deployment URL from webhook (client_payload.url); manual runs require deployment_url input.
      # API URL: constructed from ref; assumes Fastify preview at basilic-fastify-git-{branch}-{team}.vercel.app. E2E global setup polls /health.
      - name: Derive API URL and run E2E
        env:
          PLAYWRIGHT_APP_URL: ${{ github.event.inputs.deployment_url || github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || 'ci-dummy' }}
          VERCEL_TEAM_SLUG: ${{ github.event.inputs.vercel_team_slug || vars.VERCEL_TEAM_SLUG || 'gaboesquivel' }}
        run: |
          REF="${{ github.event.inputs.git_ref || github.event.client_payload.git.ref || 'main' }}"
          REF="${REF#refs/heads/}"
          REF="${REF#refs/tags/}"
          SLUG=$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//' | cut -c1-63)
          export PLAYWRIGHT_API_URL="https://basilic-fastify-git-${SLUG}-${VERCEL_TEAM_SLUG}.vercel.app"
          pnpm --filter @repo/next test:e2e
        shell: bash

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-next
          path: apps/next/playwright-report/
          retention-days: 30
