name: Setup Playwright
description: Cache and install Chromium with system deps for API and web E2E
inputs:
  workspace:
    description: Workspace directory (base or example)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.workspace)) }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Chromium
      shell: bash
      working-directory: ${{ inputs.workspace }}
      run: |
        pnpm --filter @repo/api exec playwright install chromium --with-deps
        pnpm --filter @repo/web exec playwright install chromium --with-deps
