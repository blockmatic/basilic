name: Setup pnpm
description: Install pnpm, Node from the workspace .nvmrc, dependencies, and agent skills
inputs:
  workspace:
    description: Workspace directory (base or example)
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ inputs.workspace }}/package.json
    - uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.workspace }}/.nvmrc
        cache: pnpm
        cache-dependency-path: ${{ inputs.workspace }}/pnpm-lock.yaml
    - uses: actions/cache@v4
      with:
        path: ${{ inputs.workspace }}/.agents/skills
        key: ${{ runner.os }}-agent-skills-${{ hashFiles(format('{0}/skills-lock.json', inputs.workspace)) }}
        restore-keys: |
          ${{ runner.os }}-agent-skills-
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.workspace }}
    - run: pnpm setup:skills
      shell: bash
      working-directory: ${{ inputs.workspace }}
