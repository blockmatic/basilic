name: Setup pnpm
description: Install pnpm, Node from .nvmrc, dependencies, and agent skills (basilic-skills /w-* plus mattpocock/skills)
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: actions/cache@v4
      with:
        path: .agents/skills
        key: ${{ runner.os }}-agent-skills-${{ hashFiles('skills-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-agent-skills-
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm setup:skills
      shell: bash
