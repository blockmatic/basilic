# CodeRabbit AI Code Review Configuration
# Learn more: https://docs.coderabbit.ai/guides/review-instructions

language: en-US
early_access: false
enable_free_tier: true

# Review configuration
reviews:
  # Request review for specific users
  request_changes_workflow: false
  
  # High level summary at the top of the review
  high_level_summary: true
  
  # Poem style for summary (fun, concise, informative)
  poem: true
  
  # Review level (comprehensive > simple)
  review_status: true
  
  # Collapse walkthrough details by default
  collapse_walkthrough: false
  
  # Auto-approve PRs that meet quality standards
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  
  # Path filters (exclusion patterns)
  path_filters:
    # Build artifacts and dependencies
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    
    # Generated files
    - "!**/gen/**"
    - "!**/*.gen.ts"
    - "!**/*.gen.js"
    - "!apps/api/src/db/migrations/**"
    
    # Documentation assets
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.svg"
    - "!**/*.ico"
    
    # Configuration
    - "!**/.env*"
    - "!**/tsconfig*.json"
    
    # Blockchain artifacts
    - "!**/broadcast/**"
    - "!**/out/**"
    - "!**/cache/**"
  
  # Path-specific instructions
  path_instructions:
    - path: "**/db/migrations/**"
      instructions: |
        - CRITICAL: never edit db/migrations directly. Migrations must be created via Drizzle flow (drizzle-kit generate). Flag any manual edits; validate no discrepancies.
    - path: "**/openapi/**"
      instructions: |
        - CRITICAL: never edit openapi schema files directly. OpenAPI is autogenerated from Fastify routes. Flag any manual edits; validate no discrepancies.
    - path: "**/gen/**"
      instructions: |
        - CRITICAL: never edit generated files in gen/ directly. These are autogenerated from OpenAPI spec. Flag any manual edits; validate no discrepancies.
    - path: "packages/**"
      instructions: |
        - Verify package structure follows monorepo patterns (subpath exports, dual-mode exports)
        - Ensure no server-only code leaks into client bundles
        - Follow all coding standards defined in:
          - .cursor/rules/base/typescript.mdc
          - .cursor/rules/base/general.mdc
    
    - path: "packages/ui/**"
      instructions: |
        - Verify ShadcnUI component patterns and organization
        - Follow all coding standards defined in:
          - .cursor/rules/frontend/shadcnui.mdc
          - .cursor/rules/frontend/react.mdc
          - .cursor/rules/base/typescript.mdc
    
    - path: "apps/web/**"
      instructions: |
        - Verify Next.js App Router conventions and React Server Components usage
        - Follow all coding standards defined in:
          - .cursor/rules/frontend/nextjs.mdc
          - .cursor/rules/frontend/react.mdc
          - .cursor/rules/frontend/react-hooks.mdc
          - .cursor/rules/frontend/mobile-first.mdc
          - .cursor/rules/base/typescript.mdc
          - .cursor/rules/base/general.mdc
    
    - path: "apps/docu/**"
      instructions: |
        - Verify Next.js App Router conventions and React Server Components usage
        - Ensure MDX content follows documentation standards
        - Follow all coding standards defined in:
          - .cursor/rules/frontend/nextjs.mdc
          - .cursor/rules/frontend/react.mdc
          - .cursor/rules/base/docs.mdc
          - .cursor/rules/base/typescript.mdc
    
    - path: "apps/api/**"
      instructions: |
        - CRITICAL: never edit db/migrations, openapi schema files directly. All migrations must be created through the typical Drizzle flow and OpenAPI is autogenerated. Always validate no discrepancies.
        - Verify Fastify functional patterns and TypeBox schema usage
        - Follow all coding standards defined in:
          - .cursor/rules/backend/fastify.mdc
          - .cursor/rules/base/typescript.mdc
          - .cursor/rules/base/general.mdc
    
    - path: "scripts/**"
      instructions: |
        - Verify Node.js/ESM patterns and script organization
        - Follow all coding standards defined in:
          - .cursor/rules/base/typescript.mdc
          - .cursor/rules/base/general.mdc
    
    - path: "**/*.{ts,tsx}"
      instructions: |
        - Verify TypeScript patterns and code style
        - Follow all coding standards defined in:
          - .cursor/rules/base/typescript.mdc
          - .cursor/rules/base/general.mdc
    
    - path: "**/*.{test.ts,test.tsx,spec.ts,spec.tsx,e2e-spec.ts}"
      instructions: |
        - CRITICAL: Integration tests must use real APIs with real API keys - NO MOCKS for core functionality
        - UI-only tests may mock API calls for performance, but integration tests must use real APIs
        - Follow all coding standards defined in:
          - .cursor/rules/base/typescript.mdc
          - .cursor/rules/base/general.mdc
    
    - path: "**/*.mdx"
      instructions: |
        - Verify MDX content follows documentation standards
        - Follow all coding standards defined in:
          - .cursor/rules/base/docs.mdc
    
    - path: ".cursor/**"
      instructions: |
        - Ensure rules follow MDC format with frontmatter
        - Validate skills have clear SKILL.md structure
        - Check documentation is up to date
        - Verify cross-references use @ syntax correctly
        - Follow all coding standards defined in:
          - .cursor/rules/cursor/rules.mdc
          - .cursor/rules/cursor/skills.mdc
          - .cursor/rules/base/docs.mdc
    
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: |
        - SECURITY: Verify no secrets exposed in code (API keys, tokens, passwords)
        - SECURITY: Ensure server-side validation (never trust client-side validation alone)
        - SECURITY: Verify no secrets logged (use logger redaction features)
        - LINTING: Code must pass both Biome (formatting/style) and ESLint (correctness) before merge
        - LINTING: File size limit is 300 lines (exempt: test files and UI components)
        - Follow all coding standards defined in:
          - .cursor/rules/base/general.mdc
          - .cursor/rules/base/typescript.mdc

# Chat configuration
chat:
  # Enable AI chat responses on PR comments
  auto_reply: true
