packages:
  - apps/*
  - packages/*
  - tools/*

nodeLinker: hoisted
enablePrePostScripts: true

allowBuilds:
  '@sentry/cli': true
  '@stellar/stellar-sdk': true
  blake-hash: true
  bufferutil: true
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  tiny-secp256k1: true
  unrs-resolver: true
  usb: true
  utf-8-validate: true

